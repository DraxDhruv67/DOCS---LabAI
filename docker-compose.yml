version: '3.8'

services:
  # -------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------------------
  labos-postgres:
    image: postgres:16-alpine
    container_name: labos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labos_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-labos}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labos} -d ${POSTGRES_DB:-labos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - labos-network

  # -------------------------------------------------------------------------
  # 2. LabOS Next.js Application & Code Execution Orchestrator
  # -------------------------------------------------------------------------
  labos-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labos-app
    restart: unless-stopped
    depends_on:
      labos-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://labos:labos_password_2026@labos-postgres:5432/labos?schema=public}
      JWT_SECRET: ${JWT_SECRET:-labos-production-super-secret-jwt-key-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      # Mount host Docker socket so the app can spawn execution sandboxes (python, gcc, node)
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent file uploads storage
      - storage-uploads:/app/storage/uploads
    networks:
      - labos-network

volumes:
  postgres-data:
    name: labos-postgres-data
  storage-uploads:
    name: labos-storage-uploads

networks:
  labos-network:
    name: labos-network
    driver: bridge
