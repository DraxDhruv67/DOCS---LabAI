# =====================================================
# LabOS - Production Nginx Reverse Proxy Configuration
# Optimized for 500 Concurrent Users & Large Submissions
# =====================================================

# Rate limiting zone: max 30 requests/second per IP with burst of 50
limit_req_zone $binary_remote_addr zone=labos_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _; # Replace with your domain name (e.g. labos.college.edu)

    # Increase maximum upload file size for student assignments & lab manuals
    client_max_body_size 100M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    location / {
        limit_req zone=labos_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
